<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow"><meta name="theme-color" content="#191919">
  <title>Thank You | CBlock.in</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@600;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f3;color:#171717;font-family:'DM Sans',sans-serif}
    .card{width:min(100%,520px);background:#fff;padding:40px 28px;border:1px solid #e8e8e4;border-radius:20px;text-align:center}
    .logo{display:block;width:100px;height:76px;object-fit:contain;margin:0 auto 28px}.brand{font:800 26px 'Manrope',sans-serif;letter-spacing:-1px;margin-bottom:28px}
    .check{width:68px;height:68px;margin:0 auto 24px;display:grid;place-items:center;background:#eeeee8;color:#292923;border-radius:50%;font-size:34px}
    h1{font:800 clamp(28px,6vw,37px)/1.2 'Manrope',sans-serif;letter-spacing:-1px;margin:0 0 15px}
    p{font-size:15px;line-height:1.8;color:#666;margin-bottom:28px}a{display:inline-block;background:#111;color:white;padding:15px 24px;border-radius:9px;text-decoration:none;font-size:14px;font-weight:700}
    a:hover{background:#333}.small{margin-top:32px;font-size:12px;color:#999}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="./cblock-logo.jpg" alt="CBlock.in logo" onerror="this.style.display='none'">
    <div class="check" aria-hidden="true">✓</div>
    <h1>Thank You!</h1>
    <p>Your feedback means a lot to us. Thank you for sharing your experience with CBlock.in. Your input helps us improve our services and serve you better.</p>
    <a href="./index.html">Back to Feedback Form</a>
    <div class="small">CBlock.in · Your Digital Growth Partner</div>
  </main>
</body>
</html>
